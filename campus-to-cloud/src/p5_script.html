<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const slides=$$('.slide'), stage=$('#stage'), viewport=$('#viewport');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
let cur=0, step=0, builds=true;

/* ---------- templates + generated visuals (run before step counting) ---------- */
(function(){
  const rays=Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2,c=Math.cos(a),s=Math.sin(a);return `<line class="ray" style="animation-delay:${(i*.2).toFixed(1)}s" x1="${170+c*95}" y1="${170+s*95}" x2="${170+c*150}" y2="${170+s*150}"/>`}).join('');
  $$('.slide[data-tpl]').forEach(s=>{
    const t=s.dataset.tpl,g=c=>{const e=s.querySelector(c);return e?e.innerHTML:''};
    const notes=s.querySelector('.notes');let html='';
    if(t==='q'){s.classList.add('tq');s.dataset.phase='q';
      html=`<div class="wrap"><div class="qmark"><i></i><i></i><b>?</b></div><div><div class="tag">The question in everyone's head</div><div class="qq">${g('.t-q')}</div>${g('.t-who')?`<div class="who"><span>R</span>${g('.t-who')}</div>`:''}${g('.t-hint')?`<p class="hint f" data-f="1">${g('.t-hint')}</p>`:''}</div></div>`;}
    else if(t==='wow'){s.classList.add('tw');s.dataset.phase='wow';
      html=`<div class="burst"><svg viewBox="0 0 340 340">${rays}<circle cx="170" cy="170" r="70" style="fill:rgba(255,209,102,.15);stroke:var(--gold);stroke-width:3"/><text x="170" y="192" text-anchor="middle" style="font:800 64px var(--f-display);fill:var(--gold)">!</text></svg></div><div class="content"><div class="tag">WOW moment</div><div class="recap">${g('.t-recap')}</div><div class="ans f" data-f="1">${g('.t-ans')}</div>${g('.t-x')?`<p class="xtra f" data-f="2">${g('.t-x')}</p>`:''}</div>`;}
    else if(t==='perf'){s.classList.add('tp');s.dataset.phase='perf';
      let d={rows:[]};try{d=JSON.parse(s.querySelector('script[type="application/json"]').textContent)}catch(e){console.warn('perf json',s.dataset.title,e)}
      const rows=d.rows.map((r,i)=>{const n=i+1;return `<div class="lab f" data-f="${n}">${r[0]}<small>${r[1]}</small></div><div class="barw prow f" data-f="${n}"><div class="bar b" style="--w:${Math.max(3,r[2])}%"></div><span class="val">${r[3]}</span></div><div class="barw prow f" data-f="${n}"><div class="bar a" style="--w:${Math.max(3,r[4])}%"></div><span class="val">${r[5]}</span></div><div class="delta f" data-f="${n}">${r[6]}<small>${r[7]}</small></div>`}).join('');
      html=`<h2>${g('.t-h2')}</h2><p class="how">${g('.t-how')}</p><div class="perf"><div></div><div class="ph b">Before</div><div class="ph a">After</div><div class="ph">Change</div>${rows}</div><p class="note">${d.note||''}</p>`;}
    s.innerHTML=html;if(notes)s.appendChild(notes);
  });
  // IaaS / PaaS / SaaS stack columns
  const sc=document.getElementById('stackCols');
  if(sc){const cols=[['On-prem','college lab server',0,'Homemade pizza'],['IaaS','EC2',4,'Take and bake'],['PaaS','Elastic Beanstalk',6,'Delivery'],['SaaS','Gmail, Zoom',8,'Dine out']];
    sc.innerHTML=cols.map(([n,ex,prov,piz],i)=>{const x=270+i*280;let cells='';for(let r=0;r<8;r++){const p=r>=8-prov;cells+=`<rect x="${x}" y="${78+r*56}" width="250" height="46" rx="10" class="${p?'ft':'fa'}" opacity="${p?.85:.85}"/>`}
      return `<g class="f" data-f="${i+1}"><text x="${x+125}" y="34" text-anchor="middle" style="font:700 24px var(--f-display)" class="${['ta','tt','tb','tv'][i]}">${n}</text><text x="${x+125}" y="62" text-anchor="middle" class="tmut" style="font-size:16px">${ex} · ${piz}</text>${cells}</g>`}).join('')}
})();

/* ---------- phase pips + chapter tag ---------- */
const PH=[['q','Struggle','var(--rose)'],['pic','Picture','var(--amber)'],['concept','Concept','var(--teal)'],['compare','Compare','var(--blue)'],['behind','Behind','var(--violet)'],['prod','Prod','var(--green)'],['perf','Perf','var(--coral)'],['wow','WOW','var(--gold)']];
slides.forEach(s=>{
  const p=s.dataset.phase;
  if(p){const d=document.createElement('div');d.className='phase';d.innerHTML=PH.map(([k,l,c])=>`<span style="--c:${c}" class="${k===p?'on':''}">${l}</span>`).join('');s.appendChild(d)}
  if(s.dataset.ch){const c=document.createElement('div');c.className='chtag';c.textContent=s.dataset.ch;s.appendChild(c)}
  // steps
  let mx=+(s.dataset.steps||0);
  $$('.f',s).forEach(f=>{const n=parseInt(f.dataset.f,10);if(n>mx)mx=n});
  s._max=mx;
});

/* ---------- fit ---------- */
function fit(){const w=viewport.clientWidth-32,h=viewport.clientHeight-24;stage.style.transform=`translate(-50%,-50%) scale(${Math.min(w/1600,h/900)})`}
addEventListener('resize',fit);fit();

/* ---------- builds ---------- */
const dots=$('#stepDots');
function applyStep(){
  const s=slides[cur], n=builds?step:s._max;
  $$('.f',s).forEach(f=>f.classList.toggle('on',parseInt(f.dataset.f,10)<=n));
  for(let i=1;i<=6;i++)s.classList.toggle('st'+i,n>=i);
  $$('.overlay .step-cap',s).forEach(c=>c.classList.toggle('cur',+c.dataset.s===n));
  dots.innerHTML=s._max?Array.from({length:s._max+1},(_,i)=>`<i class="${i<=n?'on':''}"></i>`).join(''):'';
  const h=hooks[s.dataset.hook];if(h&&h.step)h.step(s,n);
  const c=s.querySelector('canvas.three');if(c){const sc=ensure(c.id);if(sc&&sc.setStage)sc.setStage(n)}
}

/* ---------- nav ---------- */
const counter=$('#counter'),titleEl=$('#slideTitle'),prog=$('#progress'),notes=$('#notes'),notesBody=$('#notesBody'),notesTitle=$('#notesTitle');
function go(i,atEnd){
  i=Math.max(0,Math.min(slides.length-1,i));
  const old=slides[cur];const oh=hooks[old.dataset.hook];if(oh&&oh.leave&&i!==cur)oh.leave(old);
  old.classList.remove('active');
  cur=i;const s=slides[cur];s.classList.add('active');
  step=atEnd?s._max:0;
  counter.textContent=`${cur+1} / ${slides.length}`;titleEl.textContent=s.dataset.title||'';
  prog.style.width=((cur+1)/slides.length*100)+'%';
  const n=s.querySelector('.notes');notesTitle.textContent='Speaker notes · '+(s.dataset.title||'');notesBody.innerHTML=n?n.innerHTML:'<p>No notes.</p>';
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
  const c=s.querySelector('canvas.three');activeScene=c?ensure(c.id):null;
  const h=hooks[s.dataset.hook];if(h&&h.enter)h.enter(s);
  applyStep();
}
function next(){const s=slides[cur];if(builds&&step<s._max){step++;applyStep()}else go(cur+1)}
function prev(){if(builds&&step>0){step--;applyStep()}else go(cur-1,true)}
function typing(e){const t=e.target;return t&&/INPUT|SELECT|TEXTAREA/.test(t.tagName)}
addEventListener('keydown',e=>{
  if(typing(e)&&e.key!=='Escape')return;const k=e.key;
  if(['ArrowRight','PageDown',' ','ArrowDown'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','ArrowUp'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')go(0);else if(k==='End')go(slides.length-1);
  else if(/^[nN]$/.test(k))toggleNotes();else if(/^[oO]$/.test(k))toggleOv();else if(/^[fF]$/.test(k))toggleFs();else if(/^[bB]$/.test(k))toggleBuilds();
  else if(k==='Escape'){notes.hidden=true;ov.hidden=true}
});
$('#prevBtn').onclick=prev;$('#nextBtn').onclick=next;
function toggleNotes(){notes.hidden=!notes.hidden}$('#notesBtn').onclick=toggleNotes;
function toggleBuilds(){builds=!builds;document.body.classList.toggle('nobuild',!builds);$('#buildBtn').style.color=builds?'':'var(--amber)';applyStep()}$('#buildBtn').onclick=toggleBuilds;
function toggleFs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}catch(e){}}
$('#fsBtn').onclick=toggleFs;addEventListener('fullscreenchange',()=>setTimeout(fit,60));
let sx=null;viewport.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
viewport.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&!e.target.closest('canvas,button,select,input'))(dx<0?next:prev)();sx=null});
const ov=$('#overview'),ovGrid=$('#ovGrid');
slides.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${s.dataset.title}</span>`;if(s.classList.contains('chapter'))b.classList.add('ch');b.onclick=()=>{go(i);ov.hidden=true};ovGrid.appendChild(b)});
function toggleOv(){ov.hidden=!ov.hidden;[...ovGrid.children].forEach((b,i)=>b.classList.toggle('cur',i===cur))}$('#ovBtn').onclick=toggleOv;

/* ---------- widgets ---------- */
const cidr=$('#cidr'),cidrOut=$('#cidrOut'),cidrTxt=$('#cidrTxt');
function updCidr(){const n=+cidr.value,t=2**(32-n);cidrOut.textContent=`10.0.${n>=24?'1':'0'}.0/${n}`;cidrTxt.innerHTML=`<b>${t.toLocaleString('en-IN')}</b> addresses · <b class="hl-t">${(t-5).toLocaleString('en-IN')}</b> usable`}
if(cidr){cidr.addEventListener('input',updCidr);updCidr()}
const sT=$('#simTarget'),sP=$('#simPort'),sS=$('#simSrc'),sO=$('#simOut');
const srcName={net:'the internet',kabir:"Kabir's laptop",web:'a web server (sg-web)'};
function sim(){const t=sT.value,p=+sP.value,s=sS.value;let ok=false,why='';
  if(t==='web'){if(p===80||p===443){ok=true;why=`Rule ${p} from 0.0.0.0/0 matches everyone.`}else if(p===22&&s==='kabir'){ok=true;why='Rule 22 from 203.0.113.10/32 matches Kabir.'}else why=p===22?'SSH is open only to Kabir\'s IP.':'sg-web has no rule for 3306.'}
  else{if(p===3306&&s==='web'){ok=true;why='Rule 3306 from sg-web: any web server matches.'}else why=p===3306?'3306 is allowed only from sg-web.':`sg-db has no rule for ${p}.`}
  sO.className='verdict '+(ok?'ok':'no');sO.innerHTML=(ok?'Allowed':'Dropped')+` · ${p} from ${srcName[s]}<small>${why}${ok?'':' No matching rule means drop.'}</small>`}
if(sT){[sT,sP,sS].forEach(el=>el.addEventListener('change',sim));sim()}

const Q=[
 {q:"What makes a subnet public?",o:["Its name contains “public”","A route 0.0.0.0/0 → Internet Gateway","It has an EC2 instance","Its NACL allows all"],a:1,e:"Only the route to an Internet Gateway. Names don't matter."},

Q.splice(0,Q.length,
 {q:"What makes a subnet public?",o:["Its name contains “public”","A route 0.0.0.0/0 → Internet Gateway","It has an EC2 instance","Its NACL allows all"],a:1,e:"Only the route to an Internet Gateway. Names don't matter."},
 {q:"Which hypervisor type do cloud providers use?",o:["Type 2, like VirtualBox","Type 1, directly on hardware","No hypervisor at all","Docker"],a:1,e:"Type 1 (bare metal): ESXi, Xen, KVM, and AWS Nitro."},
 {q:"Your web SG allows 443 in. You delete all outbound rules. Do visitors still get pages?",o:["No","Yes, SGs are stateful","Only after reboot","Only with a NACL"],a:1,e:"Replies to allowed connections leave automatically."},

 {q:"A canary at 5% shows 8% errors. What should happen?",o:["Go to 100% quickly","Automatic rollback to 0%","Wait a week","Restart the database"],a:1,e:"The guardrail rolls back. Only the small slice was affected."},

let qi=0;const qText=$('#qText'),qOpts=$('#qOpts'),qExp=$('#qExplain'),qNum=$('#qNum'),qDots=$('#qDots');const done=new Set();
Q.forEach(()=>qDots.appendChild(document.createElement('i')));
function renderQ(){const d=Q[qi];qNum.textContent=`Question ${qi+1} of ${Q.length}`;qText.textContent=d.q;qOpts.innerHTML='';
  d.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${'ABCD'[j]}</span><span>${t}</span>`;b.onclick=()=>reveal(j);qOpts.appendChild(b)});
  qExp.textContent='Ask the room to vote, then click an answer or Reveal.';qExp.setAttribute('data-empty','');
  [...qDots.children].forEach((x,j)=>x.className=j===qi?'on':(done.has(j)?'done':''))}
function reveal(p){const d=Q[qi];[...qOpts.children].forEach((b,j)=>{b.classList.remove('right','wrong');if(j===d.a)b.classList.add('right');else if(j===p)b.classList.add('wrong')});
  qExp.removeAttribute('data-empty');qExp.textContent=(p===undefined||p===d.a?'Answer: ':'Not quite. Answer: ')+'ABCD'[d.a]+'. '+d.e;done.add(qi)}
$('#qReveal').onclick=()=>reveal();$('#qNext').onclick=()=>{qi=(qi+1)%Q.length;renderQ()};$('#qPrev').onclick=()=>{qi=(qi-1+Q.length)%Q.length;renderQ()};renderQ();

/* ---------- slide hooks ---------- */
const hooks={};
let timers=[];const clearT=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};
hooks.diwali={enter(){clearT();const o=$('#orders'),tp=$('#temp');let v=300;o.textContent='300';tp.setAttribute('height',0);tp.setAttribute('y',304);
  const t=setInterval(()=>{v=Math.min(9000,Math.round(v*1.09+40));o.textContent=v.toLocaleString('en-IN');const h=Math.min(292,(v/9000)*292);tp.setAttribute('height',h);tp.setAttribute('y',304-h);if(v>=9000)clearInterval(t)},90);timers.push(t)},leave:clearT};
hooks.policy={step(s,n){$$('.code .ln',s).forEach(l=>l.classList.toggle('glow',+l.dataset.l===n))}};
hooks.asg={enter(){clearT();const box=$('#asgBox');const t0=performance.now();
  const t=setInterval(()=>{const f=((performance.now()-t0)%8000)/8000;const b=f<.7?Math.max(0,Math.sin(Math.min(1,f/.62)*Math.PI)):0;const want=2+Math.round(b*8);
    let have=$$('.inst',box);
    while(have.length<want){const i=have.length;const r=document.createElementNS(NS,'rect');r.setAttribute('class','inst fa');r.setAttribute('x',30+(i%5)*166);r.setAttribute('y',60+Math.floor(i/5)*68);r.setAttribute('width',140);r.setAttribute('height',52);r.setAttribute('rx',10);r.style.opacity=0;r.style.transition='opacity .4s';box.appendChild(r);requestAnimationFrame(()=>r.style.opacity=1);have=$$('.inst',box)}
    while(have.length>want){have[have.length-1].remove();have=$$('.inst',box)}
  },200);timers.push(t)},leave:clearT};
hooks.cicd={enter(){clearT();const nodes=$$('#ciNodes circle');const t0=performance.now();
  const t=setInterval(()=>{const f=((performance.now()-t0)%7000)/7000;const idx=Math.floor(f*6+0.15);nodes.forEach((c,i)=>{c.setAttribute('class',i<=idx?'bx-a':'bx')})},120);timers.push(t)},leave:clearT};
// snapshots grid
(function(){const svg=$('#snapSvg');if(!svg)return;const used=[0,1,2,3,4,5,8,9,10,11,12,16,17,18,19,20,24,25,26,27],chg=[2,9,17,19,26];
  const cell=(x,y,cls,extra='')=>`<rect x="${x}" y="${y}" width="40" height="40" rx="6" class="${cls}" ${extra}/>`;
  let h='<text x="0" y="24" class="lbl">EBS volume</text>';
  for(let i=0;i<32;i++){const x=(i%8)*48,y=40+Math.floor(i/8)*48;h+=cell(x,y,used.includes(i)?'ft':'w-l');if(chg.includes(i))h+=cell(x,y,'fa show-on-2')}
  h+='<g class="show-on-1"><text x="470" y="24" class="lbl">Snapshot 1 · full</text>';
  for(let i=0;i<32;i++){const x=470+(i%8)*48,y=40+Math.floor(i/8)*48;if(used.includes(i))h+=cell(x,y,'fb')}h+='</g>';
  h+='<g class="show-on-2"><text x="470" y="300" class="lbl">Snapshot 2 · changes only</text>';
  for(let i=0;i<32;i++){const x=470+(i%8)*48,y=316+Math.floor(i/8)*48;h+=chg.includes(i)?cell(x,y,'fa'):(used.includes(i)?cell(x,y,'w-l','style="stroke-dasharray:4 4"'):'')}h+='</g>';
  h+='<g class="show-on-2"><text x="0" y="300" class="lbl">5 blocks changed</text><text x="0" y="340" class="ta" style="font:700 46px var(--f-display)">5 / 20</text><text x="0" y="372" class="tmut" style="font-size:17px">copied the second time</text></g>';
  svg.innerHTML=h})();
// lambda picture
hooks.lambdaPic={enter(){clearT();const evG=$('#lamEvents'),fnG=$('#lamFns'),cnt=$('#lamCount');fnG.innerHTML='';evG.innerHTML='';const cells=[];
  for(let i=0;i<30;i++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',466+(i%6)*68);r.setAttribute('y',84+Math.floor(i/6)*84);r.setAttribute('width',56);r.setAttribute('height',64);r.setAttribute('rx',10);r.setAttribute('class','fa');r.style.opacity=0;r.style.transition='opacity .35s';fnG.appendChild(r);cells.push(r)}

    if(Math.random()<load*1.2+0.05){const r=document.createElementNS(NS,'rect');r.setAttribute('width',26);r.setAttribute('height',26);r.setAttribute('rx',6);r.setAttribute('class',['ft','fv','fg'][Math.floor(Math.random()*3)]);r._x=40+Math.random()*320;r._y=60;evG.appendChild(r);evs.push(r)}

  },60);timers.push(t)},leave:clearT};

/* ---------- activity hooks ---------- */
const OK='<b class="good">ALLOWED</b>',NO='<b class="bad">DENIED</b>';
// Activity 1: least privilege

  const g=new THREE.Group();sc.add(g);
  const host=new THREE.Mesh(new THREE.BoxGeometry(13,.6,8.6),std(0x1d2b47,{metalness:.4}));host.position.y=-.3;g.add(host);g.add(P(edges(new THREE.BoxGeometry(13,.6,8.6),0xA193FF,.8),host.position.clone()));
  const hl=label('one bare-metal host','#A193FF',1);hl.position.set(-4.2,1.2,4.6);g.add(hl);
  const cols=[0xFFB547,0x3FD5C2,0xA193FF,0x6EDC92];const vms=[];
  for(let i=0;i<14;i++)for(let j=0;j<8;j++){const m=new THREE.Mesh(new THREE.BoxGeometry(.66,.66,.66),std(cols[(i*7+j)%4],{emissive:cols[(i*7+j)%4],emissiveIntensity:.25}));m.position.set(-5.85+i*.9,.35,-3.15+j*.9);m.scale.set(.001,.001,.001);m.userData={on:false,s:0};g.add(m);vms.push(m)}
  let target=.25;const st={yaw:0,pitch:0};drag(c,st);
  return {setStage(n){target=n>=1?.95:.25},render(t){size(r,cam,c);g.rotation.y=st.yaw+(reduce?0:Math.sin(t*.00015)*.25);g.rotation.x=st.pitch*.4;
    const occ=vms.filter(v=>v.userData.on).length/vms.length;
    for(let k=0;k<3;k++){const v=vms[Math.floor(Math.random()*vms.length)];if(occ<target&&!v.userData.on)v.userData.on=true;else if(occ>target-.05&&v.userData.on&&Math.random()<.5)v.userData.on=false}
    vms.forEach(v=>{const tg=v.userData.on?1:.001;const s=v.scale.x+(tg-v.scale.x)*.15;v.scale.set(s,s,s);v.position.y=.35+(1-s)*1.2});r.render(sc,cam)}};
}

/* ---------- undersea cables globe ---------- */
function initCables(){const c=$('#cables3d'),r=mkR(c),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,100);cam.position.set(0,0,7);
  const G=buildGlobe({arcs:false});sc.add(G.g);const R=2.02;
  const ll=(la,lo,rad)=>{const p=(90-la)*Math.PI/180,t=(lo+180)*Math.PI/180;return new THREE.Vector3(-rad*Math.sin(p)*Math.cos(t),rad*Math.cos(p),rad*Math.sin(p)*Math.sin(t))};
  const routes=[{n:'Fastnet · AWS · 320 Tbps',c:0xFFB547,w:[[38.3,-75.1],[45,-50],[51.6,-8.5]],lab:1},
    {n:'',c:0x3FD5C2,w:[[45.6,-123.9],[48,-170],[35,139.9]]},
    {n:'',c:0x3FD5C2,w:[[19,72.8],[12.5,45],[13,43],[30,32.5],[35,20],[43.3,5.4]]},
    {n:'',c:0x3FD5C2,w:[[13.1,80.3],[6,90],[1.3,103.8]]},
    {n:'',c:0x3FD5C2,w:[[1.3,103.8],[-10,115],[-33.9,151.2]]},
    {n:'',c:0x3FD5C2,w:[[-3.7,-38.5],[15,-30],[37.9,-8.9]]},
    {n:'',c:0x3FD5C2,w:[[26,-80],[10,-50],[-3.7,-38.5]]},
    {n:'',c:0x3FD5C2,w:[[38.7,-9.1],[15,-20],[-5,5],[-33.9,18.4]]},
    {n:'',c:0x3FD5C2,w:[[19,72.8],[0,60],[-20,57.5],[-33.9,18.4]]},
    {n:'',c:0x3FD5C2,w:[[50.8,-1.3],[52,-30],[40.6,-73.9]]}];
  const anim=[];
  routes.forEach(rt=>{const pts=[];for(let i=0;i<rt.w.length-1;i++){const a=ll(...rt.w[i],1).normalize(),b=ll(...rt.w[i+1],1).normalize();for(let k=0;k<=24;k++){const t=k/24;const v=new THREE.Vector3().copy(a).lerp(b,t).normalize().multiplyScalar(R);pts.push(v)}}
    const cv=new THREE.CatmullRomCurve3(pts);G.g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cv.getPoints(200)),new THREE.LineBasicMaterial({color:rt.c,transparent:true,opacity:rt.lab?1:.75})));
    for(let j=0;j<(rt.lab?3:2);j++){const d=new THREE.Mesh(new THREE.SphereGeometry(rt.lab?.04:.028,10,10),new THREE.MeshBasicMaterial({color:rt.lab?0xFFE3A3:0xBFFFF5}));G.g.add(d);anim.push({cv,d,o:j/(rt.lab?3:2),sp:rt.lab?.00012:.00008})}
    if(rt.lab){const lb=label(rt.n,'#FFB547',.3);lb.position.copy(ll(52,-40,2.25));G.g.add(lb)}});
  [['Mumbai',19,72.8],['Ireland',51.6,-8.5],['Virginia',38.3,-77]].forEach(([n,la,lo])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.05,12,12),new THREE.MeshBasicMaterial({color:0xFFB547}));m.position.copy(ll(la,lo,2.01));G.g.add(m);const lb=label(n,'#EBF0F9',.24);lb.position.copy(ll(la+6,lo,2.15));G.g.add(lb)});
  const st={yaw:0};drag(c,st);G.g.rotation.x=.35;
  return {render(t){size(r,cam,c);G.g.rotation.y=-1.1+st.yaw+(reduce?0:t*.00006);G.update(t);anim.forEach(a=>a.d.position.copy(a.cv.getPoint((t*a.sp+a.o)%1)));r.render(sc,cam)}}}

/* ---------- Kubernetes cluster ---------- */
function initK8s(){const c=$('#k8s3d'),r=mkR(c),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,200);lights(sc);
  const g=new THREE.Group();sc.add(g);g.add(new THREE.GridHelper(44,44,0x253350,0x18233a));
  const cp=new THREE.Mesh(new THREE.BoxGeometry(17,1,3.2),std(0x2a2350,{emissive:0x1a1440,emissiveIntensity:.6}));cp.position.set(2.5,3.6,-6.5);g.add(cp);g.add(P(edges(new THREE.BoxGeometry(17,1,3.2),0xA193FF),cp.position));
  const cpl=label('Control plane · managed by EKS','#A193FF',1.1);cpl.position.set(2.5,5.2,-6.5);g.add(cpl);
  ['API server','etcd','scheduler','controllers'].forEach((n,i)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(3.4,.6,2),std(0x3a3370,{emissive:0x2a2060,emissiveIntensity:.5}));b.position.set(-3.6+i*4.1,4.4,-6.5);g.add(b);const l=label(n,'#EBF0F9',.6);l.position.set(-3.6+i*4.1,4.95,-6.5);g.add(l)});
  const NX=[-6,0,6,12],nodes=[],nodeMats=[];
  NX.forEach((x,i)=>{const m=std(0x1d2b47,{emissive:0x0b1426});const n=new THREE.Mesh(new THREE.BoxGeometry(5,.4,5),m);n.position.set(x,.2,2);g.add(n);const e=P(edges(new THREE.BoxGeometry(5,.4,5),0x64A0FF,.9),n.position);g.add(e);
    const l=label('worker node '+(i+1)+' · EC2','#64A0FF',.75);l.position.set(x,.6,5.2);g.add(l);
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.4,2),new THREE.Vector3(Math.max(-3.6,Math.min(8.7,x)),3.1,-5)]),new THREE.LineBasicMaterial({color:0xA193FF,transparent:true,opacity:.35}));g.add(ln);
    nodes.push({n,e,l,ln});nodeMats.push(m)});
  const COL={t:0x3FD5C2,v:0xA193FF,a:0xFFB547};
  // pod table: color, [node,slot] per stage 0..3 (null = absent)
  const PT=[['t',[0,0],[0,0],[0,0],[0,0]],['v',[0,1],[0,1],[0,1],[0,1]],['t',[1,0],[1,0],[0,5],[0,5]],['v',[1,1],[1,1],[2,5],[2,5]],['t',[2,0],[2,0],[2,0],[2,0]],['v',[2,1],[2,1],[2,1],[2,1]],
    ['a',null,[0,2],[0,2],[0,2]],['a',null,[0,3],[0,3],[0,3]],['a',null,[0,4],[0,4],[0,4]],['a',null,[1,2],[0,6],[0,6]],['a',null,[1,3],[0,7],[0,7]],['a',null,[1,4],[2,6],[2,6]],['a',null,[2,2],[2,2],[2,2]],['a',null,[2,3],[2,3],[2,3]],['a',null,[2,4],[2,4],[2,4]],
    ['a',null,null,null,[3,0]],['a',null,null,null,[3,1]],['a',null,null,null,[3,2]],['a',null,null,null,[3,3]],['a',null,null,null,[3,4]],['a',null,null,null,[3,5]],['a',null,null,null,[0,8]],['a',null,null,null,[2,7]]];
  const slot=(n,s)=>new THREE.Vector3(NX[n]+((s%3)-1)*1.45,.9,2+(Math.floor(s/3)-1)*1.45);
  const pods=PT.map(([col])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),std(COL[col],{emissive:COL[col],emissiveIntensity:.25}));m.scale.set(.001,.001,.001);g.add(m);return m});
  let stg=0;const st={yaw:0,pitch:0};drag(c,st);const camT=new THREE.Vector3(1.5,12,20);cam.position.copy(camT);
  function setStage(n){stg=Math.max(0,Math.min(3,n));PT.forEach((row,i)=>{const pos=row[stg+1];const m=pods[i];if(pos){const tp=slot(...pos);if(!m.userData.on){m.position.copy(stg===2&&row[2]&&row[2][0]===1?slot(...row[2]):tp);if(!row[stg])m.position.y=4}m.userData.tp=tp;m.userData.on=true}else m.userData.on=false});
    nodeMats.forEach((mm,i)=>{const dead=stg>=2&&i===1;mm.color.setHex(dead?0x3a1520:0x1d2b47);mm.emissive.setHex(dead?0x200008:0x0b1426);nodes[i].e.material.color.setHex(dead?0xFF6F8E:0x64A0FF)});
    nodes[1].l.material.map.needsUpdate=true;const vis3=stg>=3;nodes[3].n.visible=vis3;nodes[3].e.visible=vis3;nodes[3].l.visible=vis3;nodes[3].ln.visible=vis3;
    camT.set(stg>=3?4:1.5,stg>=3?14:12,stg>=3?24:20)}
  setStage(0);
  return {setStage,render(t){size(r,cam,c);cam.position.lerp(camT,.05);cam.lookAt(stg>=3?4:1.5,1,0);g.rotation.y=st.yaw+(reduce?0:Math.sin(t*.00015)*.15);g.rotation.x=st.pitch*.3;
    pods.forEach(m=>{const tg=m.userData.on?1:.001;const s=m.scale.x+(tg-m.scale.x)*.12;m.scale.set(s,s,s);if(m.userData.tp&&m.userData.on)m.position.lerp(m.userData.tp,.08)});r.render(sc,cam)}}}

function ensure(id){if(!hasThree)return null;if(!(id in scenes)){try{scenes[id]=id==='globe'?initGlobe():id==='infra3d'?initInfra():id==='vpc3d'?initCity(id,false):id==='arch3d'?initCity(id,true):id==='s33d'?initS3():id==='fc3d'?initFC():id==='cables3d'?initCables():id==='k8s3d'?initK8s():null}catch(e){console.warn('3D init failed',id,e);scenes[id]=null}}return scenes[id]}
function loop(t){if(activeScene)activeScene.render(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
const stepBtns=$$('#archSteps .step');
stepBtns.forEach(b=>b.onclick=()=>{const s=ensure('arch3d');if(!s)return;stepBtns.forEach(x=>x.classList.toggle('on',x===b));s.step(+b.dataset.step)});

const start=()=>{const h=parseInt((location.hash||'').slice(1),10);slides[0].classList.add('active');go(h>0?h-1:0);
  setTimeout(()=>{const s=ensure('arch3d');if(s&&!$('#archSteps .step.on')){stepBtns[0].classList.add('on');s.step(1)}},400)};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start).catch(start);
})();
</script>
