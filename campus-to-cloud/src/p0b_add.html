<style>
:root{--coral:#FF9466;--gold:#FFD166}
/* ---------- template: struggle question ---------- */
.tq{justify-content:center;background:radial-gradient(700px 500px at 18% 50%,rgba(255,111,142,.10),transparent 70%)}
.tq .wrap{display:grid;grid-template-columns:300px 1fr;gap:60px;align-items:center}
.tq .qmark{width:300px;height:300px;position:relative;display:grid;place-items:center}
.tq .qmark b{font:800 220px/1 var(--f-display);color:var(--rose);text-shadow:0 0 60px rgba(255,111,142,.45);animation:qbob 3s ease-in-out infinite}
.tq .qmark i{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,111,142,.5);animation:spin 18s linear infinite}
.tq .qmark i+i{inset:30px;border-style:solid;border-color:rgba(255,111,142,.2);animation-duration:26s;animation-direction:reverse}
@keyframes qbob{50%{transform:translateY(-12px) rotate(-4deg)}}
.tq .tag{font:700 15px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.tq .qq{font:700 52px/1.15 var(--f-display);letter-spacing:-.01em;margin-top:18px;text-wrap:balance;max-width:17em}
.tq .who{display:inline-flex;gap:12px;align-items:center;margin-top:28px;font-size:22px;color:var(--muted)}
.tq .who span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--ink);font:700 18px var(--f-display)}
.tq .hint{margin-top:22px;font-size:21px;color:var(--muted);max-width:36em;line-height:1.45}
/* ---------- template: WOW answer ---------- */
.tw{justify-content:center;background:radial-gradient(800px 520px at 82% 40%,rgba(255,209,102,.12),transparent 70%)}
.tw .tag{font:700 15px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tw .recap{font-size:24px;color:var(--muted);margin-top:16px;max-width:40em}
.tw .recap::before{content:"Remember: ";color:var(--rose);font-weight:600}
.tw .ans{font:700 50px/1.15 var(--f-display);margin-top:20px;max-width:18em;text-wrap:balance}
.tw .ans em{font-style:normal;color:var(--gold)}
.tw .xtra{margin-top:24px;font-size:23px;line-height:1.5;max-width:38em;color:var(--fg)}
.tw .burst{position:absolute;right:110px;top:50%;width:340px;height:340px;transform:translateY(-50%)}
.tw .burst svg{width:100%;height:100%;overflow:visible}
.tw .burst .ray{stroke:var(--gold);stroke-width:5;stroke-linecap:round;transform-origin:170px 170px;animation:ray 2.4s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.25}50%{opacity:1}}
.tw .content{max-width:1020px;position:relative;z-index:2}
/* ---------- template: performance before/after ---------- */
.tp .perf{display:grid;grid-template-columns:300px 1fr 1fr 180px;gap:14px 22px;align-items:center;margin-top:8px}
.tp .ph{font:700 14px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tp .ph.b{color:var(--rose)}.tp .ph.a{color:var(--green)}
.tp .lab{font:600 23px/1.25 var(--f-body)}
.tp .lab small{display:block;font:400 16px/1.3 var(--f-body);color:var(--muted);margin-top:4px}
.tp .barw{height:58px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);position:relative;overflow:hidden}
.tp .bar{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.tp .bar.b{background:linear-gradient(90deg,rgba(255,111,142,.35),rgba(255,111,142,.75))}
.tp .bar.a{background:linear-gradient(90deg,rgba(110,220,146,.35),rgba(110,220,146,.8))}
.tp .val{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:700 21px/1 var(--f-mono);color:var(--fg);white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tp .delta{font:800 26px/1.1 var(--f-display);color:var(--green);text-align:center}
.tp .delta small{display:block;font:500 14px/1.2 var(--f-mono);color:var(--muted);margin-top:4px;letter-spacing:.04em}
.tp .prow.on .bar{width:var(--w)}
body.nobuild .tp .bar{width:var(--w)}
.tp .note{margin-top:auto;font-size:17px;color:var(--muted)}
.tp .how{display:flex;gap:14px;align-items:center;margin-top:4px;font-size:21px}
.tp .how b{color:var(--coral)}
/* ---------- activity widgets ---------- */
.act-badge{display:inline-flex;align-items:center;gap:8px;font:700 13px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--coral);padding:7px 12px;border-radius:999px}
.tog{display:flex;align-items:center;gap:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:19px;line-height:1.25;text-align:left;width:100%}
.tog .sw{flex:none;width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:left .2s}
.tog.on{border-color:var(--green)}
.tog.on .sw{background:var(--green)}
.tog.on .sw::after{left:23px}
.tog small{display:block;color:var(--muted);font-size:15px}
.gate{transition:all .4s}
.gate.ok rect{stroke:var(--green)}
.gate.bad rect{stroke:var(--rose);fill:rgba(255,111,142,.12)}
.mtile{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mtile b{display:block;font:800 40px/1 var(--f-display);transition:color .3s}
.mtile span{font:600 13px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.good{color:var(--green)!important}.warn{color:var(--amber)!important}.bad{color:var(--rose)!important}
.pol{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--ink-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:17px}
.pol pre{margin:0;font:400 14px/1.4 var(--f-mono);color:#D4DCEC;white-space:pre-wrap}
.pol.sel{border-color:var(--amber);background:var(--ink-3)}
.actrow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);font-size:18px}
.actrow b{text-align:right;font:700 16px var(--f-mono)}
.slider-lab{display:flex;justify-content:space-between;font:600 14px var(--f-mono);color:var(--muted)}
.feed{font-size:20px;line-height:1.45;border-left:4px solid var(--line);padding:6px 0 6px 16px;min-height:3em}
.feed.ok{border-color:var(--green)}.feed.no{border-color:var(--rose)}
.choice{display:block;width:100%;text-align:left;background:var(--ink-2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:20px;cursor:pointer;margin-bottom:10px}
.choice:hover{border-color:var(--muted)}
.choice.right{border-color:var(--green);background:rgba(110,220,146,.08)}
.choice.wrong{border-color:var(--rose);background:rgba(255,111,142,.06)}
/* lab vs enterprise */
.lve{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.lve>div{border-radius:18px;padding:20px 22px;border:1px solid var(--line)}
.lve .lab{background:rgba(255,111,142,.06);border-color:rgba(255,111,142,.5)}
.lve .ent{background:rgba(110,220,146,.06);border-color:rgba(110,220,146,.5)}
.lve h3{font-size:24px;margin-bottom:10px}
.lve pre.code{font-size:16px;padding:14px 16px}
/* steps timeline */
.tl{display:flex;gap:0;align-items:stretch}
.tl>div{flex:1;position:relative;padding:18px 16px 16px;border-top:4px solid var(--c,var(--line));background:var(--ink-2);margin-right:8px;border-radius:0 0 12px 12px}
.tl>div b{display:block;font:700 13px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--muted));margin-bottom:8px}
.tl>div p{font-size:18px;line-height:1.35}

/* ---------- docker 3D overlays ---------- */
.lpanel{position:absolute;right:16px;top:58px;width:470px;background:rgba(10,15,27,.88);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;backdrop-filter:blur(6px)}
.lrow{display:grid;grid-template-columns:14px 1fr 70px 70px;gap:10px;align-items:center;font-size:15px}
.lrow i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.lrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow b{font:700 14px var(--f-mono);text-align:right;transition:opacity .4s,color .4s}
.lrow .u{color:var(--fg)}.lrow .z{color:var(--teal);opacity:.15}
.st1 .lrow .z{opacity:1}.st1 .lrow .u{opacity:.4;text-decoration:line-through}
.lrow.tot{border-top:1px dashed var(--line);padding-top:6px;grid-template-columns:1fr 70px 70px}
.lrow.tot span{color:var(--muted);font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
.term{position:absolute;right:16px;top:58px;width:440px;background:rgba(6,9,16,.92);border:1px solid var(--line);border-radius:12px;overflow:hidden;font:400 15px/1.45 var(--f-mono);color:#D4DCEC;backdrop-filter:blur(6px)}
.term .tbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#111A2D;border-bottom:1px solid var(--line)}
.term .tbar i{width:10px;height:10px;border-radius:50%;background:var(--rose)}.term .tbar i+i{background:var(--amber)}.term .tbar i+i+i{background:var(--green)}
.term .tbar span{margin-left:8px;font-size:12px;color:var(--muted)}
.term .ln{display:none;padding:0 14px;white-space:pre-wrap}
.term .ln:first-of-type{padding-top:8px}
.term .ln.o{color:var(--muted)}
.term .p{color:var(--green)}
.term .s0{display:block}
.st1 .term .s1,.st2 .term .s2,.st3 .term .s3,.st4 .term .s4,.st5 .term .s5,.st6 .term .s6{display:block;animation:typ .6s steps(24,end) both}
.st1 .term .ln.o,.st2 .term .ln.o{animation-delay:.5s}
.term .ln:last-child{padding-bottom:10px}
.term .cur{animation:blink 1s steps(2) infinite}
@keyframes typ{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cmp-yaml .y{display:inline;transition:background .3s,color .3s;border-radius:4px}
.st1:not(.st2) .cmp-yaml .y:not(.yv){background:rgba(63,213,194,.12)}
.st2:not(.st3) .cmp-yaml .yf{background:rgba(255,181,71,.22)}
.st3:not(.st4) .cmp-yaml .yb{background:rgba(63,213,194,.2)}
.st4:not(.st5) .cmp-yaml .yp,.st4:not(.st5) .cmp-yaml .yk{background:rgba(255,111,142,.18)}
.st5 .cmp-yaml .yv,.st5 .cmp-yaml .yp,.st5 .cmp-yaml .yk{background:rgba(161,147,255,.2)}

/* spring boot dockerfile */
.sbcode .ln{display:block;border-radius:6px;padding:0 6px;transition:background .3s,opacity .3s}
.st1 .sbcode .ln{opacity:.38}
.st1:not(.st2) .sbcode .g1{background:rgba(255,181,71,.18);opacity:1}
.st2:not(.st3) .sbcode .g2{background:rgba(255,181,71,.18);opacity:1}
.st3:not(.st4) .sbcode .g3{background:rgba(255,181,71,.18);opacity:1}
.st4:not(.st5) .sbcode .g4{background:rgba(255,181,71,.18);opacity:1}
.st5:not(.st6) .sbcode .g5{background:rgba(255,181,71,.18);opacity:1}
.st6:not(.st7) .sbcode .g6{background:rgba(255,181,71,.18);opacity:1}
.st7:not(.st8) .sbcode .g7{background:rgba(255,181,71,.18);opacity:1}
.dx{display:none}.dx.d0{display:block}.st1 .dx.d0{display:none}
.st1:not(.st2) .dx.d1{display:block}
.st2:not(.st3) .dx.d2{display:block}
.st3:not(.st4) .dx.d3{display:block}
.st4:not(.st5) .dx.d4{display:block}
.st5:not(.st6) .dx.d5{display:block}
.st6:not(.st7) .dx.d6{display:block}
.st7:not(.st8) .dx.d7{display:block}
.dx h3{font-size:28px;margin:6px 0 10px}.dx p{font-size:20px;line-height:1.5;color:var(--fg)}
.sbs1,.sbs2,.sbjar{transition:opacity .5s}
.sbs2{opacity:.3}.st4 .sbs2{opacity:1}.st4 .sbs1{opacity:.45}.sbjar{opacity:.15}.st6 .sbjar{opacity:1}
/* docker activity */
#dkaSvg .pk{display:none}
#dkaSvg[data-r="1"] .pk1,#dkaSvg[data-r="2"] .pk2,#dkaSvg[data-r="3"] .pk3,#dkaSvg[data-r="4"] .pk4{display:inline}
#dkaSvg .nw-shop{display:none}#dkaSvg[data-r="3"] .nw-shop,#dkaSvg[data-r="4"] .nw-shop{display:inline}#dkaSvg[data-r="3"] .nw-def,#dkaSvg[data-r="4"] .nw-def{display:none}
#dkaPanel .rnd{display:none}#dkaPanel[data-r="1"] .r1,#dkaPanel[data-r="2"] .r2,#dkaPanel[data-r="3"] .r3,#dkaPanel[data-r="4"] .r4{display:block}
.rnd .ans{display:none}.rnd.show .ans{display:block}
pre.labc{font-size:16.5px;line-height:1.45;padding:16px 18px}

/* our dockerfiles tabs */
#dftWrap .dft{display:none;height:100%;flex-direction:column;gap:10px}
#dftWrap[data-t="java"] .java,#dftWrap[data-t="node"] .node,#dftWrap[data-t="ang"] .ang{display:flex}
.dfhead{display:flex;gap:16px;align-items:baseline;font-size:20px}
.dfrow{display:flex;gap:20px;min-height:0;flex:1}
.dfcode{flex:1.25;font-size:15.5px;line-height:1.55;padding:14px 16px;margin:0}
.dfcode .ln{display:block;border-radius:6px;padding:0 6px;transition:background .25s,opacity .25s}
.dfcode .ln i{display:inline-block;width:22px;font-style:normal;color:var(--amber);font-weight:700}
.dfcode[data-g]:not([data-g=""]) .ln{opacity:.35}
.dfcode[data-g="1"] .g1{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="2"] .g2{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="3"] .g3{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="4"] .g4{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="5"] .g5{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="6"] .g6{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="7"] .g7{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="8"] .g8{opacity:1;background:rgba(255,181,71,.18)}
.dfcode[data-g="9"] .g9{opacity:1;background:rgba(255,181,71,.18)}
.dfnotes{flex:1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.dfnotes li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.38;padding:7px 10px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);cursor:pointer}
.dfnotes li i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ink-3);color:var(--amber);font:700 14px var(--f-mono)}
.dfnotes li.on{border-color:var(--amber);background:var(--ink-3)}
.dfnotes li b{color:var(--fg)}

/* where variables come from */
.vflow .vf{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.vfh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:20px}
.vflow pre.code{font-size:19px;line-height:1.6;padding:14px 16px;flex:1;white-space:pre-wrap}
.vfnote{font-size:16px}
.vflow .v{border-radius:5px;padding:1px 4px;transition:background .3s,box-shadow .3s}
.st1 .vflow .vb{background:rgba(161,147,255,.28);box-shadow:0 0 0 1px var(--violet)}
.st2 .vflow .vr{background:rgba(255,181,71,.25);box-shadow:0 0 0 1px var(--amber)}
.vbox{border-left:4px solid var(--c)}

/* compose → k8s map */
.maps{display:flex;flex-direction:column;gap:7px;justify-content:center}
.map{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.map .mc{display:flex;flex-direction:column}.map .mc span{font-size:18px}.map small{font-size:14px;color:var(--muted)}.map .ma{text-align:center;font-size:24px;color:var(--muted)}.map .mk{font-size:19px}
/* k8s folder map */
.kf{text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;line-height:1.3;color:var(--fg)}
.kf:hover{border-color:var(--muted)}.kf.on{border-color:var(--teal);background:var(--ink-3)}
#k8fSvg .ko{transition:opacity .3s,filter .3s}
#k8fSvg[data-sel] .ko{opacity:.18}
#k8fSvg[data-sel="k-kus"] .ko{opacity:1;filter:drop-shadow(0 0 6px var(--teal))}
#k8fSvg[data-sel="k-ns"] .k-ns{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-sc"] .k-sc{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-cm"] .k-cm{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-sec"] .k-sec{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-app"] .k-app{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-kafka"] .k-kafka{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-mail"] .k-mail{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-ing"] .k-ing{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
#k8fSvg[data-sel="k-kus"] .k-kus{opacity:1;filter:drop-shadow(0 0 8px var(--teal))}
.kx{display:none}.kx h3{font-size:24px;margin:4px 0 6px}.kx p{font-size:18px;line-height:1.45}
.kxwrap:not([data-sel]) .k-none{display:block}
.kxwrap[data-sel="k-ns"] .kx.k-ns{display:block}
.kxwrap[data-sel="k-sc"] .kx.k-sc{display:block}
.kxwrap[data-sel="k-cm"] .kx.k-cm{display:block}
.kxwrap[data-sel="k-sec"] .kx.k-sec{display:block}
.kxwrap[data-sel="k-app"] .kx.k-app{display:block}
.kxwrap[data-sel="k-kafka"] .kx.k-kafka{display:block}
.kxwrap[data-sel="k-mail"] .kx.k-mail{display:block}
.kxwrap[data-sel="k-ing"] .kx.k-ing{display:block}
.kxwrap[data-sel="k-kus"] .kx.k-kus{display:block}

.kyw pre.code{font-size:18.5px;line-height:1.5;padding:12px 14px;white-space:pre}
.kyw .v{border-radius:5px;padding:1px 3px;transition:background .3s,box-shadow .3s}
.kyout{display:flex;flex-direction:column;gap:8px;margin-top:6px}.kyout p{font-size:18px;line-height:1.4}
.c1{color:var(--violet)}.c2{color:var(--teal)}.c3{color:var(--amber)}.c4{color:var(--green)}.c5{color:var(--rose)}
.st1 .kyw .k1{background:rgba(161,147,255,.3);box-shadow:0 0 0 1px var(--violet)}
.st2 .kyw .k2{background:rgba(63,213,194,.25);box-shadow:0 0 0 1px var(--teal)}
.st3 .kyw .k3{background:rgba(255,181,71,.25);box-shadow:0 0 0 1px var(--amber)}
.st4 .kyw .k4{background:rgba(110,220,146,.25);box-shadow:0 0 0 1px var(--green)}
.st2 .kyw .k2r{background:rgba(255,111,142,.25);box-shadow:0 0 0 1px var(--rose)}
.st5 .kyw .k5{background:rgba(255,111,142,.25);box-shadow:0 0 0 1px var(--rose)}

/* thank you */
.tysoon{text-align:center;margin-top:-10px;font:700 24px var(--f-mono);color:var(--violet);letter-spacing:.06em;animation:blink 1.6s steps(2) infinite}
.tyou{gap:18px;padding:36px 28px 40px;background:radial-gradient(900px 500px at 50% 40%,rgba(255,181,71,.10),transparent 70%)}
.tyrow{display:grid;grid-template-columns:1fr 190px 1fr;gap:16px;align-items:center;min-height:0}
.typh{margin:0;position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.typh img{display:block;width:100%;height:auto}
.typh figcaption{position:absolute;left:12px;top:12px;font:800 24px/1 var(--f-display);color:var(--ink);background:var(--amber);padding:8px 14px;border-radius:12px}
.typh:last-child figcaption{background:var(--teal)}
.tymid{text-align:center}
.tyego{font:800 22px/1.2 var(--f-display);color:var(--fg)}
.tyego span{display:block;color:var(--rose);font-size:23px;margin-top:8px;text-shadow:0 0 30px rgba(255,111,142,.5)}
.tynever{text-align:center;font:800 46px/1.1 var(--f-display);background:linear-gradient(90deg,var(--teal),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
