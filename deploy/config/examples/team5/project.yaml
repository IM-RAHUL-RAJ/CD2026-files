# The finished file for Neueda-Learning/chennai-capstone-SE6-team5.
# GUIDE.html, step 1, shows how each value was found.

name: team5

folders:
  frontend:
    path: Frontend/trading-ui
    type: angular
    health: /
  auth:
    path: Services/auth-service
    type: node
    health: /
  order:
    path: Services/order-service
    type: java
    health: /actuator/health
  executor:
    path: Services/executor-service
    type: java
    health: /actuator/health

sql:
  - Databases/PostgreSQL/migrations
  - Databases/PostgreSQL/seed

mailpit: true

settings:
  POSTGRES_HOST: "{db_host}"
  POSTGRES_PORT: "{db_port}"
  POSTGRES_DB: "{db_name}"
  POSTGRES_USER: "{db_user}"
  POSTGRES_SCHEMA: trade
  POSTGRES_SEARCH_PATH: auth
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{db_host}:{db_port}/{db_name}?currentSchema=trade"
  SPRING_DATASOURCE_USERNAME: "{db_user}"
  PGSSLMODE: "{db_sslmode}"
  KAFKA_BOOTSTRAP_SERVERS: "{kafka}"
  JWT_ISSUER: auth-service
  APP_CORS_ALLOWED_ORIGINS: "{cors_origins}"
  APP_FRONTEND_URL: "{frontend_url}"
  AUTH_SERVICE_URL: "{auth_internal}"
  TRADE_API_BASE_URL: "{order_internal}"
  SPRING_MAIL_HOST: "{mail_host}"
  SPRING_MAIL_PORT: "{mail_port}"
  SPRING_MAIL_AUTH: "false"
  SPRING_MAIL_STARTTLS: "false"
  APP_MAIL_FROM: noreply@holdmystocks.com
  FAUXNANCE_BASE_URL: https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1
  CURRENCYAPI_BASE_URL: https://api.currencyapi.com
  POLL_INTERVAL_SECONDS: "60"

secrets:
  - POSTGRES_PASSWORD
  - JWT_SECRET
  - FAUXNANCE_API_KEY
  - CURRENCYAPI_API_KEY

database_password: POSTGRES_PASSWORD

# Kubernetes and Jenkins only. Not read by docker-compose.
kubernetes:
  registry: 123456789012.dkr.ecr.ap-south-1.amazonaws.com
  routes:
    auth: [/auth]
    order: [/api/v1]
  skip_tests: [order]     # one unit test fails on main (PriceAlertEvaluatorTest)
  smoke:
    - {path: /, expect: 200}
    - {path: /auth/me, expect: 401}
    - {path: /api/v1/accounts/1, expect: 401}
