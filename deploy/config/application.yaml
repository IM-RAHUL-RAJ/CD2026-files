# Every block is explained in GUIDE.html, step 1.
# After any change run:  python3 deploy/config/apply.py

phase: docker             # local | docker | eks

project:
  name: trading
  root: ..

public:
  scheme: http
  host: localhost         # on an EC2 box: its public IP

services:
  frontend:
    path: frontend
    type: angular         # java | node | angular | python
    port: 4200
    health: /
    test: false
  auth:
    path: auth-service
    type: node
    port: 3000
    health: /
    routes: [/auth]
    test: true
  order:
    path: order-service
    type: java
    port: 8081
    health: /actuator/health
    routes: [/api/v1]
    test: true
  executor:
    path: executor-service
    type: java
    port: 8082
    health: /actuator/health
    test: true

database:
  host: postgres          # postgres = the container; otherwise the RDS endpoint
  port: 5432
  name: trading_db
  user: postgres
  password_env: POSTGRES_PASSWORD
  sql:
    - db/schema.sql
    - db/seed-data.sql

kafka:
  host: kafka
  port: 29092

mail:
  mailpit: true
  host: mailpit
  port: 1025

aws:
  region: ap-south-1
  cluster: capstone
  namespace: trading
  image_prefix: trading

env:
  POSTGRES_HOST: "{db_host}"
  POSTGRES_PORT: "{db_port}"
  POSTGRES_DB: "{db_name}"
  POSTGRES_USER: "{db_user}"
  PGSSLMODE: "{db_sslmode}"
  KAFKA_BOOTSTRAP_SERVERS: "{kafka}"
  CORS_ALLOWED_ORIGINS: "{cors_origins}"

secrets:
  - POSTGRES_PASSWORD
  - JWT_SECRET

smoke:
  - {path: /, expect: 200}
